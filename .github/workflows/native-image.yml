name: Optional native-image integration
on: [workflow_dispatch]
jobs:
  native-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - run: ./integration/native-image/run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-image-parity
          path: |
            parity/target/native-image/*.tsv
            parity/target/native-image/*.diff
            parity/target/native-image/*.txt
            parity/target/native-image/*.log
            parity/target/native-image/*.sha256
